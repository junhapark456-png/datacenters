<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DC Map">
<title>Data Center Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
:root{--navy:#0F2747;--blue:#A9BFDA;--sel:#6F8FBD;--grey:#E4E4E4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--navy);background:#fff}
#map,.leaflet-container{position:absolute;inset:0;background:#fff}
#legend{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:500;font-size:13px;background:rgba(255,255,255,.85);padding:6px 10px}
#legend div{display:flex;align-items:center;gap:8px;margin:4px 0}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
#chips{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;z-index:500;display:flex;gap:8px;overflow-x:auto;padding:0 14px}
.chip{flex:0 0 auto;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
#stat{position:absolute;left:18px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:500;display:none;background:rgba(255,255,255,.8);padding:4px 8px}
.goldrule{width:44px;height:2px;background:#C8A96A;margin:8px 0 4px}
.big{font-size:36px;font-weight:300}.big span{font-size:18px}
.sub{font-size:13px}
#add{position:absolute;right:16px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:600;width:54px;height:54px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
#banner{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:700;background:var(--navy);color:#fff;padding:8px 14px;font-size:14px;display:none}
#ov{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:28px 18px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.wrap{position:relative;width:min(440px,100%)}
.tab{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:2;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:8px 26px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.card{background:#fff;border:2px solid var(--navy);max-height:80vh;overflow:auto;padding:30px 24px 18px;box-shadow:0 10px 30px rgba(15,39,71,.2)}
.card h2{font-size:19px;margin:0 0 12px}
.row{font-size:14px;line-height:1.5;margin:5px 0}
.rule2{border-bottom:1px solid rgba(15,39,71,.5);margin-top:12px}
.close{position:absolute;top:6px;right:8px;z-index:3;border:none;background:none;font-size:24px;color:var(--navy);cursor:pointer}
.item{display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid #e3e8ef;padding:10px 0;font-size:14px;color:var(--navy);cursor:pointer}
label{display:block;font-size:12px;font-weight:600;margin-top:10px}
input,textarea{width:100%;padding:8px;border:1px solid #C9D3E0;font:inherit;font-size:16px}
.btn{margin-top:14px;margin-right:6px;background:var(--navy);color:#fff;border:1px solid var(--navy);padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--navy)}
a{color:var(--navy)}
</style>
</head>
<body>
<div id="map"></div>
<div id="legend">
  <div><span class="dot" style="background:#E4E4E4"></span>No data centers tracked</div>
  <div><span class="dot" style="background:#A9BFDA"></span>Countries with tracked data centers</div>
</div>
<div id="stat"><div class="goldrule"></div><div class="big" id="s1"></div><div class="sub" id="s2"></div></div>
<div id="banner">Tap the map to place the pin</div>
<button id="add" title="Add data center">+</button>
<div id="chips"></div>
<div id="ov"></div>
<script>
const CSV_URL='datacenters.csv';
const NAME_MAP={"United States of America":"United States","South Korea":"South Korea","S. Korea":"South Korea","Korea":"South Korea","Hong Kong":"Hong Kong SAR"};
const map=L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:2,attributionControl:false}).setView([20,115],3);
L.control.zoom({position:'topright'}).addTo(map);
const pinLayer=L.layerGroup().addTo(map);
let base=[],user=JSON.parse(localStorage.getItem('dc_user')||'[]'),selected=null,picking=false,draft=null;
const countryLayers={};
const ov=document.getElementById('ov');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{const n=parseFloat(String(s==null?'':s).replace(/,/g,''));return isNaN(n)?null:n};
const all=()=>base.concat(user);
const save=()=>localStorage.setItem('dc_user',JSON.stringify(user));
const hasData=()=>new Set(all().map(d=>d.country));

function parseCSV(t){const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
  else f+=c}
 if(f||r.length){r.push(f);rows.push(r)}return rows}

function pinIcon(n){return L.divIcon({className:'',iconSize:[28,36],iconAnchor:[14,36],
 html:`<svg width="28" height="36" viewBox="0 0 26 34"><path d="M13 1C6.4 1 1 6.3 1 12.8 1 21.6 13 33 13 33s12-11.4 12-20.2C25 6.3 19.6 1 13 1z" fill="#0F2747"/>${n>1?`<text x="13" y="16.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">${n}</text>`:'<circle cx="13" cy="12.5" r="5" fill="#fff"/>'}</svg>`})}

function restyle(){const has=hasData();
 for(const n in countryLayers)countryLayers[n].forEach(l=>l.setStyle({fillColor:n===selected?'#6F8FBD':has.has(n)?'#A9BFDA':'#E4E4E4'}))}

function drawCountries(fc){
 L.geoJSON(fc,{style:{color:'#fff',weight:.8,fillColor:'#E4E4E4',fillOpacity:1},
  onEachFeature:(f,l)=>{const n=NAME_MAP[f.properties.name]||f.properties.name;
   (countryLayers[n]=countryLayers[n]||[]).push(l);
   l.on('click',()=>{if(!picking&&hasData().has(n))selectCountry(n)})}}).addTo(map);
 restyle()}

function buildChips(){const el=document.getElementById('chips');
 el.innerHTML=`<button class="chip" data-c="">World</button>`+[...hasData()].sort().map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.dataset.c?selectCountry(b.dataset.c):reset());
 markChips()}
const markChips=()=>document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.c===(selected||'')));

function reset(){selected=null;pinLayer.clearLayers();restyle();markChips();document.getElementById('stat').style.display='none';map.setView([20,115],3)}

function selectCountry(n){
 selected=n;restyle();markChips();pinLayer.clearLayers();
 const list=all().filter(d=>d.country===n&&d.lat!=null&&d.lng!=null);
 const groups={};list.forEach(d=>{const k=d.lat.toFixed(4)+','+d.lng.toFixed(4);(groups[k]=groups[k]||[]).push(d)});
 const pts=[];
 Object.values(groups).forEach(g=>{const m=L.marker([g[0].lat,g[0].lng],{icon:pinIcon(g.length)}).addTo(pinLayer);
  m.on('click',()=>g.length>1?showList(g):showCard(g[0]));pts.push([g[0].lat,g[0].lng])});
 if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(0.5),{maxZoom:10});
 const mw=list.reduce((s,d)=>s+(d.mw||0),0);
 document.getElementById('s1').innerHTML=`${list.length} <span>Data Centers</span>`;
 document.getElementById('s2').textContent=`${n} · ${Math.round(mw).toLocaleString()} MW disclosed capacity`;
 document.getElementById('stat').style.display='block'}

function openOv(tab,inner){ov.innerHTML=`<div class="wrap"><div class="tab">${esc(tab)}</div><button class="close" onclick="closeOv()">×</button><div class="card">${inner}<div class="rule2"></div></div></div>`;ov.style.display='flex'}
function closeOv(){ov.style.display='none';ov.innerHTML=''}
ov.addEventListener('click',e=>{if(e.target===ov)closeOv()});

function showCard(d){
 const mw=d.mw!=null?`<b>${d.mw.toLocaleString(undefined,{maximumFractionDigits:2})} MW</b>`:'Not disclosed';
 const src=d.src?`<a href="${esc(d.src)}" target="_blank" rel="noopener">Open source ↗</a>`:'—';
 openOv(d.country,`<h2>${esc(d.name)}</h2>
  <div class="row">Location: <b>${esc(d.loc)}</b></div>
  <div class="row">Capacity: ${mw}</div>
  <div class="row">Source: ${src}</div>
  ${d.notes?`<div class="row" style="opacity:.8">${esc(d.notes)}</div>`:''}
  ${d.user?`<button class="btn ghost" onclick="delUser('${d.id}')">Delete this entry</button>`:''}`)}

function showList(g){window._g=g;
 openOv(`${g[0].loc} · ${g.length} sites`,`<h2>Select a data center</h2>`+g.map((d,i)=>`<button class="item" onclick="showCard(window._g[${i}])">${esc(d.name)}${d.mw!=null?` — <b>${d.mw.toLocaleString()} MW</b>`:''}</button>`).join(''))}

function delUser(id){user=user.filter(d=>d.id!==id);save();closeOv();buildChips();selected?selectCountry(selected):restyle()}

function openForm(){
 openOv('Add Data Center',`<form id="f">
  <label>Country</label><input name="country" list="cl" required><datalist id="cl">${[...hasData()].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>Data center name</label><input name="name" required>
  <label>Location (city)</label><input name="loc" required>
  <label>Capacity (MW)</label><input name="mw" type="number" step="any" inputmode="decimal">
  <label>Latitude</label><input name="lat" type="number" step="any" inputmode="decimal" required>
  <label>Longitude</label><input name="lng" type="number" step="any" inputmode="decimal" required>
  <button type="button" class="btn ghost" id="pick">📍 Pick location on map</button>
  <label>Source URL</label><input name="src" type="url">
  <label>Notes</label><textarea name="notes" rows="2"></textarea>
  <button class="btn" type="submit">Save</button><button type="button" class="btn ghost" id="exp">Export my additions (${user.length})</button></form>`);
 const f=document.getElementById('f');
 const d0=draft||{country:selected||''};for(const k in d0)if(f.elements[k])f.elements[k].value=d0[k];draft=null;
 document.getElementById('pick').onclick=()=>{draft=Object.fromEntries(new FormData(f));closeOv();picking=true;document.getElementById('banner').style.display='block'};
 document.getElementById('exp').onclick=exportUser;
 f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));
  const d={id:'u'+Date.now(),user:true,country:v.country.trim(),name:v.name.trim(),loc:v.loc.trim(),mw:num(v.mw),lat:num(v.lat),lng:num(v.lng),src:v.src.trim(),notes:v.notes.trim()};
  user.push(d);save();closeOv();buildChips();selectCountry(d.country)}}

map.on('click',e=>{if(!picking)return;picking=false;document.getElementById('banner').style.display='none';
 draft=Object.assign(draft||{},{lat:e.latlng.lat.toFixed(4),lng:e.latlng.lng.toFixed(4)});openForm()});

function exportUser(){
 const q=s=>`"${String(s==null?'':s).replace(/"/g,'""')}"`;
 const csv=user.map(d=>[d.country,d.name,d.loc,d.mw,d.lat,d.lng,d.src,d.notes].map(q).join(',')).join('\n');
 openOv('Export',`<h2>Your additions</h2><div class="row">Copy these rows into the matching country tab in Excel so both devices get them on the next update.</div><textarea rows="8" readonly>${esc(csv)}</textarea>`)}

document.getElementById('add').onclick=()=>{draft=null;openForm()};

Promise.all([
 fetch(CSV_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('datacenters.csv not found');return r.text()}),
 fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r=>r.json())
]).then(([csv,topo])=>{
 const rows=parseCSV(csv.replace(/^\uFEFF/,'')).filter(r=>r.length>=6&&r[1]&&r[1]!=='Data Center');
 base=rows.map(r=>({country:r[0].trim(),name:r[1],loc:r[2],mw:num(r[3]),lat:num(r[4]),lng:num(r[5]),src:r[6]||'',notes:r[7]||''})).filter(d=>d.lat!=null&&d.lng!=null);
 drawCountries(topojson.feature(topo,topo.objects.countries));
 buildChips();
}).catch(e=>alert('Could not load map data: '+e.message));
</script>
</body>
</html>
